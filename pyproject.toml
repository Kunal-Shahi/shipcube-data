[project]
name = "shipcube-data"
version = "0.1.0"
description = "ShipCube's data layer: a semantic layer whose models live in a catalog database and change through model migrations."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
dev = ["duckdb>=1.0", "pytest>=8.0"]

[project.scripts]
shipcube-data = "shipcube_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcube_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
