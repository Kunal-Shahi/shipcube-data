[project]
name = "shipcube-data"
version = "0.2.0"
description = "ShipCube's data layer: a semantic layer whose models live in a catalog database and change through model migrations."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
bigquery = ["google-cloud-bigquery>=3.25"]
all = ["duckdb>=1.0", "psycopg[binary]>=3.2", "google-cloud-bigquery>=3.25"]
dev = ["duckdb>=1.0", "psycopg[binary]>=3.2", "google-cloud-bigquery>=3.25", "pytest>=8.0"]

[project.scripts]
shipcube-data = "shipcube_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcube_data"]

[tool.hatch.build.targets.wheel.force-include]
"examples/olist/migrations" = "shipcube_data/examples/olist/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to a real warehouse (Postgres via SHIPCUBE_TEST_PG_URL, BigQuery via SHIPCUBE_TEST_BQ_PROJECT)"]
