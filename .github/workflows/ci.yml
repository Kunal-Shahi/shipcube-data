name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Catalog tests run on SQLite and Postgres; the Postgres warehouse integration tests use the same server.
      SHIPCUBE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 .venv
      - run: uv pip install -p .venv -e '.[dev]'
      - run: .venv/bin/pytest -q
      - name: Local stack path (seed + smoke), DuckDB and Postgres warehouses
        env:
          SHIPCUBE_DEV_MODE: "1"
          SHIPCUBE_DATA_CATALOG_URL: postgresql://postgres:postgres@localhost:5432/shipcube_data
          SHIPCUBE_DATA_ALLOWED_DB_HOSTS: localhost
        run: |
          SHIPCUBE_DATA_WORKSPACE=0e364bd8-4622-42d1-839c-35aae720b52b SHIPCUBE_DATA_DUCKDB_PATH=/tmp/olist.duckdb \
            sh -c '.venv/bin/shipcube-data seed && .venv/bin/shipcube-data smoke'
          SHIPCUBE_DATA_WORKSPACE=11111111-2222-4333-8444-555555555555 SHIPCUBE_DATA_WAREHOUSE=postgres \
            SHIPCUBE_DATA_WAREHOUSE_URL='postgresql://postgres:postgres@localhost:5432/warehouse?sslmode=disable' \
            sh -c '.venv/bin/shipcube-data seed && .venv/bin/shipcube-data smoke'
      - name: Build the wheel
        run: uv build --wheel

  bigquery:
    # Real-BigQuery integration tests. Needs Workload Identity Federation configured as repo variables;
    # skipped (not failed) until then. Datasets are created per run and deleted afterwards.
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SHIPCUBE_TEST_BQ_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -e '.[dev]'
      - run: .venv/bin/pytest -q -m integration tests/integration/test_bigquery_warehouse.py
